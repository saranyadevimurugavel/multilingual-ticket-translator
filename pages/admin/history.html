<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>History</title>

<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/components/sidebar.css">
<link rel="stylesheet" href="../../assets/css/components/navbar.css">
<link rel="stylesheet" href="../../assets/css/components/cards.css">
<link rel="stylesheet" href="../../assets/css/components/forms.css">
<link rel="stylesheet" href="../../assets/css/components/buttons.css">
<link rel="stylesheet" href="../../assets/css/responsive.css">
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <div class="logo-area">
            <div class="logo-icon">🌐</div>
            <div class="logo-text">
                <h3>MTT</h3>
                <p>Ticket Translator</p>
            </div>
        </div>

        <ul class="menu">
            <li class="menu-item">
                <a href="dashboard.html">📊 Dashboard</a>
            </li>
            <li class="menu-item">
                <a href="translation-center.html">🌍 Translation Center</a>
            </li>
            <li class="menu-item active">
                <a href="history.html">🕒 History</a>
            </li>
            <li class="menu-item">
                <a href="batch.html">📂 Batch Processing</a>
            </li>
        </ul>

    </aside>

    <main class="main-content">

        <header class="top-navbar">
            <button class="hamburger">☰</button>
            <div class="app-title">History</div>
        </header>

        <section class="content-wrapper">

            <div class="card">

                <div class="card-title">
                    Translation Queue
                </div>

                <div class="form-group">
                    <label class="form-label">Ticket ID</label>
                    <input class="form-control" value="TK-1001">
                </div>

                <div class="form-group">
                    <label class="form-label">Source Language</label>
                    <input class="form-control" value="French">
                </div>

                <div class="form-group">
                    <label class="form-label">Target Language</label>
                    <input class="form-control" value="English">
                </div>

                <div class="form-group">
                    <label class="form-label">Original Ticket</label>

                    <textarea
                        class="form-control"
                        rows="6">
Bonjour, je ne peux pas accéder à mon compte.
                    </textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Translated Ticket</label>

                    <textarea
                        class="form-control"
                        rows="6">
Hello, I cannot access my account.
                    </textarea>
                </div>

                <button class="btn btn-primary">
                    Approve Translation
                </button>

                <button class="btn btn-danger">
                    Reject
                </button>

            </div>

        </section>

    </main>

</div>

<script src="../../assets/js/sidebar.js"></script>

</body>
</html>
