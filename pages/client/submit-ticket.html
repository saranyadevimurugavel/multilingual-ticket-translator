<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Ticket</title>
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/components/forms.css">
<link rel="stylesheet" href="../../assets/css/components/cards.css">
<link rel="stylesheet" href="../../assets/css/components/buttons.css">
<style>
  /* ── File upload zone ──────────────────────────────────────────── */
  .upload-zone {
    border: 2px dashed #cbd5e1;
    border-radius: 10px;
    padding: 22px 18px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    background: #f8fafc;
    position: relative;
  }
  .upload-zone:hover,
  .upload-zone.dragover {
    border-color: #2563EB;
    background: #eff6ff;
  }
  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .upload-zone .upload-icon  { font-size: 1.8rem; margin-bottom: 6px; }
  .upload-zone .upload-text  { font-size: .9rem; color: #64748b; }
  .upload-zone .upload-hint  { font-size: .78rem; color: #94a3b8; margin-top: 4px; }
  .file-preview {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding: 9px 14px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 8px;
    font-size: .88rem;
    color: #166534;
  }
  .file-preview .remove-file {
    margin-left: auto;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    color: #dc2626;
    line-height: 1;
  }
</style>
</head>

<body>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/translation.js"></script>

<div style="max-width:900px; margin:50px auto;">

  <div class="card">

    <h2 style="margin-bottom:20px;">Submit Support Ticket</h2>

    <div class="form-group">
      <label class="form-label">Subject</label>
      <input class="form-control" id="ticket-subject" placeholder="Enter subject">
    </div>

    <div class="form-group">
      <label class="form-label">Attachment <span style="color:#94a3b8; font-weight:400;">(optional)</span></label>
      <div class="upload-zone" id="upload-zone">
        <input type="file" id="ticket-attachment"
               accept=".txt,.pdf,.doc,.docx,.png,.jpg,.jpeg,.gif,.webp">
        <div class="upload-icon">📎</div>
        <div class="upload-text">Click to upload or drag &amp; drop a file</div>
        <div class="upload-hint">Supported: TXT, PDF, DOC, DOCX, PNG, JPG, GIF, WEBP</div>
      </div>
      <div id="file-preview" style="display:none;" class="file-preview">
        <span>📄</span>
        <span id="file-name"></span>
        <button class="remove-file" onclick="removeFile()" title="Remove file">✕</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Message</label>
      <textarea rows="8" class="form-control" id="ticket-message"
        placeholder="Type your support message here in any language..."></textarea>
    </div>

    <button class="btn btn-primary" id="submit-ticket-btn">
      Submit Ticket
    </button>

  </div>

</div>

</body>
</html>
